name: Reusable - Create Release

# Net-new, additive workflow (docs/adr/0004-versioning-strategy.md). github-release.yml is kept
# unchanged for its existing consumers (CoGuide_PPS_BackEnd/FrontEnd, Conecta_SLA — see
# specs/001-reusable-ci-platform/analysis-report.md Finding 2); new callers use this one.

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch/SHA) used for release source'
        required: false
        type: string
        default: ''
      release_version:
        description: 'Release version without v prefix. Empty => extracted from version_file'
        required: false
        type: string
        default: ''
      version_file:
        description: 'Path to a package.json to extract the version from when release_version is empty'
        required: false
        type: string
        default: './package.json'
      prerelease:
        description: 'Mark release as prerelease'
        required: false
        type: boolean
        default: false
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Create Tag & Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      url: ${{ steps.create_release.outputs.url || steps.existing_release.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Resolve release version
        id: vars
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          VERSION_FILE: ${{ inputs.version_file }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_VERSION" ]; then
            VERSION="$RELEASE_VERSION"
          elif [ -n "$VERSION_FILE" ] && [ -f "$VERSION_FILE" ]; then
            VERSION=$(node -p "require('./' + process.env.VERSION_FILE.replace(/^\.\//, '')).version")
          else
            echo "::error::No release_version provided and version_file '$VERSION_FILE' not found"
            exit 1
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: exists
        shell: bash
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.exists.outputs.exists != 'true'
        shell: bash
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.exists.outputs.exists != 'true'
        id: create_release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Release ${tag}`,
              draft: false,
              prerelease: process.env.IS_PRERELEASE === 'true',
              generate_release_notes: true,
            });
            core.setOutput('url', release.data.html_url);

      - name: Reuse existing release URL
        if: steps.exists.outputs.exists == 'true'
        id: existing_release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            core.setOutput('url', release.data.html_url);

      - name: Summary
        shell: bash
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          TAG: ${{ steps.vars.outputs.tag }}
          NEW_URL: ${{ steps.create_release.outputs.url }}
          EXISTING_URL: ${{ steps.existing_release.outputs.url }}
        run: |
          set -euo pipefail
          URL="${NEW_URL:-$EXISTING_URL}"
          {
            echo "## Release"
            echo "- Version: $VERSION"
            echo "- Tag: $TAG"
            echo "- URL: $URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Discord
        if: env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ env.DISCORD_WEBHOOK_URL }}
          status: success
          title: "Release ${{ steps.vars.outputs.tag }}"
          description: "${{ steps.create_release.outputs.url || steps.existing_release.outputs.url }}"
          color: 3066993
          username: Release Bot
