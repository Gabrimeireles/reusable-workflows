name: "Resolve project"
description: >-
  Validates project_name/environment_name and computes+validates the remote deploy path,
  rejecting anything outside the configured base directory or containing path traversal.
inputs:
  project_name:
    description: "Project identifier, e.g. myapp"
    required: true
  environment_name:
    description: "Environment label, e.g. homolog"
    required: true
  deploy_path_override:
    description: "Explicit deploy path override; must resolve under base_dir"
    required: false
    default: ""
  base_dir:
    description: "Base directory all deploy paths must live under"
    required: false
    default: "/srv/stacks"
outputs:
  deploy_path:
    description: "Validated absolute deploy path on the remote host"
    value: ${{ steps.resolve.outputs.deploy_path }}
runs:
  using: "composite"
  steps:
    - id: resolve
      shell: bash
      env:
        PROJECT_NAME: ${{ inputs.project_name }}
        ENVIRONMENT_NAME: ${{ inputs.environment_name }}
        DEPLOY_PATH_OVERRIDE: ${{ inputs.deploy_path_override }}
        BASE_DIR: ${{ inputs.base_dir }}
      run: |
        set -euo pipefail

        name_pattern='^[a-z][a-z0-9-]{1,48}$'
        env_pattern='^[a-z][a-z0-9-]{1,31}$'
        base_pattern='^/[a-zA-Z0-9/_-]+$'

        if [[ ! "$PROJECT_NAME" =~ $name_pattern ]]; then
          echo "::error::Invalid project_name '$PROJECT_NAME' (must match $name_pattern)"
          exit 1
        fi

        if [[ ! "$ENVIRONMENT_NAME" =~ $env_pattern ]]; then
          echo "::error::Invalid environment_name '$ENVIRONMENT_NAME' (must match $env_pattern)"
          exit 1
        fi

        if [[ ! "$BASE_DIR" =~ $base_pattern ]] || [[ "$BASE_DIR" == *".."* ]]; then
          echo "::error::Invalid base_dir '$BASE_DIR'"
          exit 1
        fi
        # Strip a single trailing slash, if present, for consistent concatenation below.
        BASE_DIR="${BASE_DIR%/}"

        if [ -n "$DEPLOY_PATH_OVERRIDE" ]; then
          DEPLOY_PATH="$DEPLOY_PATH_OVERRIDE"
        else
          DEPLOY_PATH="$BASE_DIR/$PROJECT_NAME"
        fi

        if [[ "$DEPLOY_PATH" == *".."* ]]; then
          echo "::error::deploy_path '$DEPLOY_PATH' must not contain '..'"
          exit 1
        fi

        case "$DEPLOY_PATH" in
          "$BASE_DIR"/*) ;;
          *)
            echo "::error::deploy_path '$DEPLOY_PATH' must be under '$BASE_DIR'"
            exit 1
            ;;
        esac

        if [[ ! "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9/_-]+$ ]]; then
          echo "::error::deploy_path '$DEPLOY_PATH' contains characters outside [a-zA-Z0-9/_-]"
          exit 1
        fi

        echo "deploy_path=$DEPLOY_PATH" >> "$GITHUB_OUTPUT"
        echo "Resolved deploy path: $DEPLOY_PATH"
