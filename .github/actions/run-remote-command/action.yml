name: "Run remote command"
description: >-
  Runs a caller-supplied, opaque shell command inside a named Compose service via
  `docker compose run --rm`. Originally scoped to migration/reset/seed; generalized in
  Iteration 2 (docs/adr/0009-hooks.md) into the executor for all remote lifecycle hooks. The
  platform never inspects or special-cases the command's content
  (see docs/adr/0005-project-specific-commands.md) — it is the caller's own tool of choice.
inputs:
  enabled: { required: false, default: "true" }
  label:
    description: "Human label for logs/summary, e.g. migration, reset, seed, hook:pre_deploy"
    required: true
  deploy_user: { required: true }
  deploy_host: { required: true }
  deploy_path: { required: true }
  compose_filename: { required: false, default: "docker-compose.yml" }
  service:
    description: >-
      Compose service to run the command inside via `docker compose run --rm`. Leave empty to
      run the command directly in a login shell on the remote host (in deploy_path) instead —
      used by lifecycle hooks that aren't tied to one container.
    required: false
    default: ""
  command: { required: true }
runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        ENABLED: ${{ inputs.enabled }}
        LABEL: ${{ inputs.label }}
        DEPLOY_USER: ${{ inputs.deploy_user }}
        DEPLOY_HOST: ${{ inputs.deploy_host }}
        DEPLOY_PATH: ${{ inputs.deploy_path }}
        COMPOSE_FILENAME: ${{ inputs.compose_filename }}
        SERVICE: ${{ inputs.service }}
        COMMAND: ${{ inputs.command }}
      run: |
        set -euo pipefail

        if [ "$ENABLED" != "true" ]; then
          echo "Skipping $LABEL (not requested)."
          exit 0
        fi
        if [ -z "$COMMAND" ]; then
          echo "::error::No command configured for '$LABEL' but it was requested"
          exit 1
        fi

        if [ -n "$SERVICE" ]; then
          echo "Running $LABEL in service '$SERVICE'..."
        else
          echo "Running $LABEL on the remote host..."
        fi

        {
          printf 'DEPLOY_PATH=%q\n' "$DEPLOY_PATH"
          printf 'COMPOSE_FILENAME=%q\n' "$COMPOSE_FILENAME"
          printf 'SERVICE=%q\n' "$SERVICE"
          printf 'COMMAND=%q\n' "$COMMAND"
          cat <<'REMOTE_SCRIPT'
        set -euo pipefail
        cd "$DEPLOY_PATH"
        if [ -n "$SERVICE" ]; then
          docker compose --env-file .env -f "$COMPOSE_FILENAME" run --rm -T "$SERVICE" sh -lc "$COMMAND" </dev/null
        else
          sh -lc "$COMMAND" </dev/null
        fi
        REMOTE_SCRIPT
        } | ssh "$DEPLOY_USER@$DEPLOY_HOST" "bash -s"
