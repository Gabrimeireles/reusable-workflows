extends: default

rules:
  line-length:
    max: 120
    level: warning
  document-start: disable
  truthy:
    # GitHub Actions workflows use an unquoted `on:` key universally; don't flag it.
    check-keys: false
  comments:
    min-spaces-from-content: 1
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1

ignore: |
  .specify/
  node_modules/
